<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="정보보안 실천 연습: 정보 분류, 위협 요소 판별, 보안 기술 실습, 디지털 윤리 실천을 직접 해 보며 점검하는 학생용 연습장">
<meta name="theme-color" content="#f6f1e7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d2433'/%3E%3Cpath d='M16 6l8 3v7c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V9z' fill='%23f6f1e7'/%3E%3C/svg%3E">
<title>정보보안 실천 연습장</title>
<style>
:root{--paper:#f6f1e7;--card:#fffdf8;--ink:#1d2433;--mute:#5d6577;--line:#d9d0bd;--red:#c4262e;--redbg:#fbe4e2;--green:#1f7a4d;--greenbg:#dff2e6;--blue:#1d4f91;--bluebg:#e0ebf8;--amber:#a56200;--amberbg:#fcefd0;--mk1:#ffe08a;--mk2:#b9e6c9;--mk3:#bcd7f5;--r:10px}
@media(prefers-color-scheme:dark){:root{--paper:#171b26;--card:#1f2432;--ink:#ece8dc;--mute:#a4a9b8;--line:#3a4157;--red:#ff7b80;--redbg:#3d2024;--green:#6fd6a0;--greenbg:#1b3328;--blue:#8fb8ee;--bluebg:#1d2a40;--amber:#f0b95a;--amberbg:#3a2e16;--mk1:#6b5a1a;--mk2:#25553a;--mk3:#274a78}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
h1,h2,h3{font-family:"Noto Serif KR","Nanum Myeongjo","Batang",serif;line-height:1.3;margin:0 0 .5em}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 60px}
header.top{border-bottom:3px double var(--ink);padding:16px 0 10px;margin-bottom:14px}
header.top .k{font-size:12px;letter-spacing:.14em;color:var(--red);font-weight:700}
header.top h1{font-size:28px;margin:2px 0 0}
nav{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 18px}
nav a{padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;font-size:14px;background:var(--card)}
nav a.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px}
.passage{border-left:4px solid var(--ink);padding:6px 0 6px 14px;margin:8px 0;font-size:15.5px}
.note{font-size:14px;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,.btn{font:inherit;font-size:15px;padding:8px 14px;border-radius:8px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer}
button:hover{background:var(--ink);color:var(--paper)}
button.pri{background:var(--ink);color:var(--paper)}
button.sel{background:var(--blue);border-color:var(--blue);color:#fff}
button.ok{background:var(--green);border-color:var(--green);color:#fff}
button.no{background:var(--red);border-color:var(--red);color:#fff}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
textarea,input[type=text],select{width:100%;font:inherit;font-size:15px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
label{display:block;font-size:14px;font-weight:700;margin:10px 0 4px}
.tag{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12.5px;font-weight:700}
.tag.P{background:var(--redbg);color:var(--red)}.tag.S{background:var(--greenbg);color:var(--green)}
.fb{margin-top:8px;padding:8px 12px;border-radius:8px;font-size:14.5px}
.fb.good{background:var(--greenbg);color:var(--green)}.fb.bad{background:var(--redbg);color:var(--red)}.fb.info{background:var(--bluebg);color:var(--blue)}.fb.warn{background:var(--amberbg);color:var(--amber)}
mark{padding:1px 2px;border-radius:3px;color:inherit}.m0{background:var(--mk1)}.m1{background:var(--mk2)}.m2{background:var(--mk3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}header.top h1{font-size:23px}}
.cat{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.cat:last-child{border:0}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;transition:width .2s}
table.ac{border-collapse:collapse;width:100%;font-size:14px}table.ac th,table.ac td{border:1px solid var(--line);padding:6px;text-align:center}
table.ac td button{width:100%;padding:6px 4px;font-size:13.5px}
.chk li{list-style:none;margin:2px 0}.chk{padding:0;margin:8px 0}
.chk .y::before{content:"✔ ";color:var(--green);font-weight:700}.chk .n::before{content:"✘ ";color:var(--red);font-weight:700}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.steps a{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.steps a:hover{border-color:var(--ink)}.steps b{font-family:"Noto Serif KR",serif;font-size:17px}
.big{font-size:22px;font-family:"Noto Serif KR",serif;font-weight:700}
.files .f{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line)}
.sw{display:inline-flex;gap:6px;align-items:center;margin-right:14px;font-size:15px}.sw input{width:20px;height:20px}
.small{font-size:13px}
</style>
</head>

</div>
<script>

  if(/컴퓨터 바이러스|악성코드|랜섬/.test(text))return {cat:'컴퓨터 바이러스 정보',pair:5};
  if(/해킹/.test(text))return {cat:'해킹 정보',pair:5};
  if(/태풍|지진|재난|홍수|대피/.test(text))return {cat:'재난 정보',pair:null};
  for(const k of [3,0,1,4,6,2]){const p=D.pairs[k];if(new RegExp(p.topic).test(text)){
    if(k===6)return {cat:p.p,pair:k};
    if(k===3&&!pers)return {cat:p.g,pair:k};
    if(k===0&&/바이러스/.test(text)&&!pers)return {cat:p.g,pair:k};
    return {cat:pers?p.p:(p.g||p.p),pair:k}}}
  return null}
